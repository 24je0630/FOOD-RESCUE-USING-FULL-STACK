version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: food_rescue_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_rescue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: ./server
    container_name: food_rescue_server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/food_rescue?schema=public
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build: 
      context: ./client
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: food_rescue_client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
